name: 测试

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run validate:story
      - run: npm run check:ui
      - run: npm run lint
      - run: npm run test:regressions
      - run: npm run test:cov   # c8 + 60% 红线门禁（tools/check_coverage.mjs）
      - run: npm run test:story
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: 17 结局与 App 巡览
        run: |
          node test_server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node tools/verify-endings.mjs
          node tools/inspect-apps.mjs
